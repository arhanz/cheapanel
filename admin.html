<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cheapanel – Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#ffffff;--card:#f6f6f6;--line:#e2e2e2;--text:#111111;--mute:#666666;--acc:#ff4d1a;--acc2:#d63a0a;--err:#dc2626;--ok:#15803d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Rajdhani','Segoe UI',Arial,sans-serif;font-size:18px;line-height:1.5}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acc2);outline-offset:3px}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:'Anton',Impact,sans-serif;font-weight:400;line-height:1.05;margin:0}
nav{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.logo{font-family:'Anton',Impact,sans-serif;font-size:26px}.logo b{color:var(--acc);font-weight:400}
.btn{display:inline-block;background:var(--acc);color:#000;font:inherit;font-weight:700;padding:12px 24px;border-radius:4px;border:0;cursor:pointer}
.btn:hover{background:var(--acc2);color:#fff}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--acc);color:var(--acc);background:transparent}
.btn.sm{padding:6px 14px}
.view{display:none}.view.on{display:block}
.auth{max-width:420px;margin:56px auto;padding:0 20px}
.auth h1{font-size:48px;margin-bottom:8px}
.auth p.sub{color:var(--mute);margin:0 0 24px}
label{display:block;font-weight:700;margin:16px 0 6px}
input,select{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);padding:12px;border-radius:4px;font:inherit}
input:focus,select:focus{border-color:var(--acc);outline:none}
.msg{min-height:24px;margin:12px 0;color:var(--err);font-weight:600}
.msg.ok{color:var(--ok)}
.auth .btn{width:100%;margin-top:6px}
.alt{text-align:center;color:var(--mute);margin-top:18px}.alt a{color:var(--acc);font-weight:700}
.dash{padding:36px 0 60px}
.dash h1{font-size:clamp(34px,6vw,52px)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:26px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px}
.stat span{color:var(--mute)}.stat b{display:block;font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:38px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px;margin-bottom:18px}
.panel h2{font-size:26px;margin-bottom:14px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-of-type{border-top:0}
.row small{color:var(--mute);display:block}
code{background:#eee;padding:2px 8px;border-radius:4px;color:var(--acc2)}
.empty{color:var(--mute)}
.tag{font-weight:700;color:var(--acc2)}
.inline{display:flex;gap:8px}.inline input{flex:1}.inline .btn{width:auto;margin:0}
@media(max-width:720px){.cols{grid-template-columns:1fr}}

[hidden]{display:none!important}
input[type=checkbox]{width:auto}
textarea{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);padding:12px;border-radius:4px;font:inherit;min-height:90px}
select.st{width:auto}
.tabsA{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}
.tabsA button{background:none;border:1px solid var(--line);color:var(--text);padding:8px 18px;border-radius:4px;font:inherit;font-weight:700;cursor:pointer}
.tabsA button.on{background:var(--acc);border-color:var(--acc);color:#000}
.bar{display:flex;gap:10px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.banner{background:#fff4dc;border:1px solid var(--acc2);color:var(--acc2);padding:10px 14px;border-radius:4px;margin-bottom:16px;font-weight:600}
.panel{margin-top:18px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th{text-align:left;color:var(--mute);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl small{display:block;color:var(--mute)}
.scroll{overflow-x:auto}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 10px;flex-wrap:wrap}
.ph h2{font-size:30px}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;overflow:auto;padding:20px}
.mbox{background:#fff;border:1px solid var(--line);border-radius:6px;max-width:560px;margin:20px auto;padding:22px}
.mbox h2{margin-bottom:6px}
.pill{background:none;font:inherit;cursor:pointer;font-weight:700;padding:2px 12px;border-radius:99px;border:1px solid var(--line);font-size:15px}
.pill.on{color:var(--ok);border-color:var(--ok)}
.pill.off{color:var(--mute)}
.acts{white-space:nowrap}
.dng:hover{border-color:var(--err)!important;color:var(--err)!important}
.prev{color:var(--acc2);font-weight:700;min-height:26px;margin-top:10px}
.panel,.stat{box-shadow:0 1px 3px rgba(0,0,0,.07)}
.mrow{border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:12px}
</style>
</head>
<body>
<header class="wrap"><nav>
<a class="logo" href="#">CHEA<b>PANEL</b> <span style="font-size:16px;color:var(--mute)">ADMIN</span></a>
<button class="btn ghost sm" id="out" hidden>Log out</button>
</nav></header>
<main class="wrap">
<div id="gate" class="auth"><h1>Admin</h1><p class="sub">Owner access only.</p>
<label for="le">Email</label><input id="le" type="email" autocomplete="email">
<label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password">
<div class="msg" id="gm" role="alert"></div>
<button class="btn" id="lb">Log in</button></div>
<div id="app" hidden>
<div class="tabsA" id="tabs"><button data-t="users" class="on">Users</button><button data-t="orders">Orders</button><button data-t="lic">Licenses</button><button data-t="prod">Products</button><button data-t="set">Settings</button></div>
<div id="pane"></div>
</div>
</main>
<div class="mod" id="md" hidden><div class="mbox" id="mb"></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,getDocs,getDoc,doc,setDoc,updateDoc,deleteDoc,query,where} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyAYeAtMYejinyUq8qsC0SZqrWI9Ah_x32o",authDomain:"cheapanel-01.firebaseapp.com",projectId:"cheapanel-01",storageBucket:"cheapanel-01.firebasestorage.app",messagingSenderId:"104612795141",appId:"1:104612795141:web:4915fba56f9880695f1d6c"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const $=i=>document.getElementById(i),pane=$("pane");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const D=t=>t?new Date(t).toLocaleString():"-";
const STAT=["Pending payment","Paid","Delivered","Rejected","Cancelled"];
let U=[],P=[],L=[],note="";
const run=f=>f().catch(e=>{pane.innerHTML='<p class="msg">Error: '+esc(e.code||e.message)+'</p>'});

onAuthStateChanged(auth,async u=>{
 if(!u){$("gate").hidden=false;$("app").hidden=true;$("out").hidden=true;$("gm").textContent=note;return}
 let ok=false;try{ok=(await getDoc(doc(db,"admins",u.uid))).exists()}catch(e){}
 if(!ok){note="This account is not an admin.";await signOut(auth);return}
 note="";$("gate").hidden=true;$("app").hidden=false;$("out").hidden=false;go("users");
});
$("lb").onclick=async()=>{note="";try{await signInWithEmailAndPassword(auth,$("le").value.trim(),$("lp").value)}catch(e){$("gm").textContent="Email or password is incorrect."}};
$("lp").addEventListener("keydown",e=>{if(e.key==="Enter")$("lb").click()});
$("out").onclick=()=>signOut(auth);
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>go(b.dataset.t));
function go(t){
 document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
 pane.innerHTML='<p class="empty">Loading…</p>';
 run({users:vUsers,orders:vOrders,lic:vLic,prod:vProd,set:vSet}[t]);
}

/* USERS */
const openM=h=>{$("mb").innerHTML=h;$("md").hidden=false};
const closeM=()=>{$("md").hidden=true};
$("md").addEventListener("click",e=>{if(e.target.id==="md")closeM()});
async function vUsers(){
 const s=await getDocs(collection(db,"users"));
 U=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.joined||0)-(a.joined||0));
 pane.innerHTML='<div class="ph"><h2>Users ('+U.length+')</h2><button class="btn sm" data-act="addu">+ Add user</button></div><div class="bar"><input id="qs" placeholder="Search name, email or WhatsApp" aria-label="Search users"></div><div class="panel scroll"><table class="tbl"><thead><tr><th>Name</th><th>Email</th><th>WhatsApp</th><th>Balance</th><th>Joined</th><th></th></tr></thead><tbody id="ul"></tbody></table></div>';
 const draw=()=>{const q=$("qs").value.toLowerCase();const l=U.filter(u=>((u.name||"")+(u.email||"")+(u.whatsapp||"")).toLowerCase().includes(q));
  $("ul").innerHTML=l.length?l.map(u=>'<tr><td><b>'+esc(u.name)+'</b></td><td>'+esc(u.email)+'</td><td>'+esc(u.whatsapp)+'</td><td>$'+esc(u.balance)+'</td><td>'+(u.joined?new Date(u.joined).toLocaleDateString():"-")+'</td><td class="acts"><button class="btn ghost sm" data-act="view" data-id="'+esc(u.id)+'">View</button> <button class="btn ghost sm" data-act="editu" data-id="'+esc(u.id)+'">Edit</button> <button class="btn ghost sm dng" data-act="delu" data-id="'+esc(u.id)+'">Delete</button></td></tr>').join(""):'<tr><td colspan="6" class="empty">No users found.</td></tr>'};
 $("qs").oninput=draw;draw();
}
function formU(u){
 openM('<h2>Edit user</h2><label for="un">Name</label><input id="un" value="'+esc(u.name)+'"><label for="ue">Email (cannot be changed)</label><input id="ue" value="'+esc(u.email)+'" disabled><label for="uw">WhatsApp</label><input id="uw" value="'+esc(u.whatsapp)+'"><label for="ub">Balance (USD)</label><input id="ub" type="number" step="0.01" value="'+esc(u.balance)+'"><div class="msg" id="um"></div><div class="inline"><button class="btn" data-act="saveu" data-id="'+esc(u.id)+'">Save</button><button class="btn ghost" data-act="closem">Cancel</button></div>');
}
function formNewU(){
 openM('<h2>Add user</h2><label for="mn">Name</label><input id="mn"><label for="me">Email</label><input id="me" type="email"><label for="mw">WhatsApp</label><input id="mw" type="tel"><label for="mp">Password (min 8 characters)</label><input id="mp" type="text" autocomplete="off"><div class="msg" id="mm"></div><div class="inline"><button class="btn" data-act="mku">Create user</button><button class="btn ghost" data-act="closem">Cancel</button></div>');
}
async function vView(id){
 const u=U.find(x=>x.id===id);
 const [o,k]=await Promise.all([getDocs(query(collection(db,"orders"),where("uid","==",id))),getDocs(query(collection(db,"licenses"),where("assignedTo","==",id)))]);
 const os=o.docs.map(d=>d.data()).sort((a,b)=>b.date-a.date),ks=k.docs.map(d=>({key:d.id,...d.data()}));
 const wn=String(u.whatsapp||"").replace(/\D/g,"");
 pane.innerHTML='<button class="btn ghost sm" data-act="back">← All users</button><div class="banner" style="margin-top:14px">Viewing '+esc(u.name)+'’s account (read only, exactly as they see it)</div>'
 +'<div class="stats"><div class="stat"><span>Balance</span><b>$'+esc(u.balance)+'</b></div><div class="stat"><span>Active panels</span><b>'+ks.length+'</b></div><div class="stat"><span>Orders</span><b>'+os.length+'</b></div></div>'
 +'<div class="panel"><h2>Profile</h2><div class="row"><span>Email</span><b>'+esc(u.email)+'</b></div><div class="row"><span>WhatsApp</span><b>'+esc(u.whatsapp)+'</b> <a class="btn ghost sm" target="_blank" rel="noopener" href="https://wa.me/'+wn+'">Chat</a></div><div class="row"><span>Joined</span><b>'+D(u.joined)+'</b></div><div class="row"><span>User ID</span><code>'+esc(id)+'</code></div></div>'
 +'<div class="panel"><h2>Balance</h2><div class="inline"><input id="bal" type="number" step="0.01" value="'+esc(u.balance)+'" aria-label="Balance"><button class="btn" data-act="bal" data-id="'+esc(id)+'">Save</button></div><div class="msg" id="bm"></div></div>'
 +'<div class="panel"><h2>Orders</h2>'+(os.length?os.map(x=>'<div class="row"><div><b>'+esc(x.item)+'</b><small>Player ID '+esc(x.pid)+' · '+D(x.date)+'</small></div><div><span class="tag">$'+esc(x.price)+'</span> · '+esc(x.status)+'</div></div>').join(""):'<p class="empty">No orders.</p>')+'</div>'
 +'<div class="panel"><h2>Panels</h2>'+(ks.length?ks.map(x=>'<div class="row"><div><code>'+esc(x.key)+'</code><small>'+esc(x.plan)+' · redeemed '+D(x.redeemedAt)+'</small></div></div>').join(""):'<p class="empty">No panels.</p>')+'</div>';
}

/* ORDERS */
async function vOrders(){
 const s=await getDocs(collection(db,"orders"));
 const os=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.date-a.date);
 const open=os.filter(o=>o.status==="Pending payment").length;
 pane.innerHTML='<div class="stats"><div class="stat"><span>All orders</span><b>'+os.length+'</b></div><div class="stat"><span>Pending</span><b>'+open+'</b></div></div><div class="panel">'+(os.length?os.map(o=>'<div class="row"><div><b>'+esc(o.item)+'</b> <span class="tag">$'+esc(o.price)+'</span><small>'+esc(o.email)+(o.pid?' · Player ID '+esc(o.pid):'')+' · '+D(o.date)+(o.hasProof?' · <b class="tag">Proof sent</b>':'')+'</small></div><div class="acts">'+(o.hasProof?'<button class="btn ghost sm" data-act="proof" data-id="'+esc(o.id)+'">Review</button> ':'')+'<select class="st" data-act="st" data-id="'+esc(o.id)+'" aria-label="Status">'+STAT.map(x=>'<option'+(x===o.status?' selected':'')+'>'+x+'</option>').join("")+'</select></div></div>').join(""):'<p class="empty">No orders yet.</p>')+'</div>';
}

/* LICENSES */
const AL="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const rnd=n=>Array.from(crypto.getRandomValues(new Uint32Array(n)),x=>AL[x%AL.length]).join("");
function drawL(){$("ll").innerHTML=L.length?L.map(k=>'<div class="row"><div><code>'+esc(k.key)+'</code><small>'+esc(k.plan)+' · '+(k.assignedTo?'used by '+esc(k.assignedTo):'unused')+'</small></div><button class="btn ghost sm" data-act="delk" data-id="'+esc(k.key)+'">Delete</button></div>').join(""):'<p class="empty">No keys yet.</p>';$("lc").textContent=L.length}
async function vLic(){
 const s=await getDocs(collection(db,"licenses"));
 L=s.docs.map(d=>({key:d.id,...d.data()})).sort((a,b)=>(b.created||0)-(a.created||0));
 pane.innerHTML='<div class="panel"><h2>Generate keys</h2><div class="grid2"><div><label for="lpn">Plan name</label><input id="lpn" placeholder="Free Fire - 1 Week"></div><div><label for="lqty">How many (1-50)</label><input id="lqty" type="number" min="1" max="50" value="1"></div></div><div class="msg" id="lmg"></div><button class="btn" data-act="gen">Generate</button><textarea id="lout" readonly placeholder="New keys appear here" aria-label="New keys" style="margin-top:12px"></textarea></div><div class="panel"><h2>All keys (<span id="lc"></span>)</h2><div id="ll"></div></div>';
 drawL();
}

/* PRODUCTS */
const PL=[["1 Week",7,"/ week","+ 3 days free","",""],["1 Month",30,"/ month","+ 1 week free","",""],["1 Year",255,"/ year","+ 1 month free",360,"30% OFF"]];
const FE=["Precise aimbot, easy to use","Auto-updates included","Anti-ban protection","Setup help on WhatsApp"];
const baseOf=p=>p.base??(p.old||p.price);
const discOf=p=>p.disc??(p.old?Math.round((1-p.price/p.old)*100):0);
async function vProd(){
 const s=await getDocs(collection(db,"products"));
 P=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));
 pane.innerHTML='<div class="ph"><h2>Plans ('+P.length+')</h2><div><button class="btn sm" data-act="addp">+ Add plan</button>'+(P.length?' <button class="btn ghost sm" data-act="feat">Apply default features to all</button>':' <button class="btn ghost sm" data-act="seed">Import default plans</button>')+'</div></div>'
 +(P.length?'<div class="panel scroll"><table class="tbl"><thead><tr><th>Game</th><th>Plan</th><th>Original</th><th>Discount</th><th>Final price</th><th>Status</th><th></th></tr></thead><tbody>'+P.map(p=>'<tr><td>'+esc(p.game)+'</td><td><b>'+esc(p.name)+'</b><small>'+esc(p.bonus)+'</small></td><td>$'+esc(baseOf(p))+'</td><td>'+(discOf(p)>0?discOf(p)+'%':'-')+'</td><td><b>$'+esc(p.price)+'</b><small>'+esc(p.per)+'</small></td><td><button class="pill '+(p.active===false?'off':'on')+'" data-act="tog" data-id="'+esc(p.id)+'">'+(p.active===false?'Hidden':'Live')+'</button></td><td class="acts"><button class="btn ghost sm" data-act="editp" data-id="'+esc(p.id)+'">Edit</button> <button class="btn ghost sm dng" data-act="delp" data-id="'+esc(p.id)+'">Delete</button></td></tr>').join("")+'</tbody></table></div>':'<div class="panel"><p class="empty">Your shop is using the built-in default plans. Import them to edit prices and add discounts.</p></div>');
}
function formP(p){
 p=p||{};
 openM('<h2>'+(p.id?'Edit plan':'Add plan')+'</h2><input type="hidden" id="pid" value="'+esc(p.id||"")+'"><div class="grid2"><div><label for="pgame">Game</label><select id="pgame"><option value="ff"'+(p.cat==="pubg"?'':' selected')+'>Free Fire</option><option value="pubg"'+(p.cat==="pubg"?' selected':'')+'>PUBG Mobile</option></select></div><div><label for="pname">Plan name</label><input id="pname" value="'+esc(p.name||"")+'" placeholder="Aimbot Panel – 1 Week"></div><div><label for="pprice">Original price (USD)</label><input id="pprice" type="number" step="0.01" value="'+esc(p.id?baseOf(p):"")+'"></div><div><label for="pdisc">Discount % (0 = none)</label><input id="pdisc" type="number" min="0" max="95" value="'+esc(p.id?discOf(p):0)+'"></div><div><label for="pper">Period label</label><input id="pper" value="'+esc(p.per||"")+'" placeholder="/ week"></div><div><label for="pbonus">Bonus badge</label><input id="pbonus" value="'+esc(p.bonus||"")+'" placeholder="+ 3 days free"></div><div><label for="porder">Sort order</label><input id="porder" type="number" value="'+esc(p.order||0)+'"></div></div><div class="prev" id="pprev"></div><label for="pfeats">Features (one per line)</label><textarea id="pfeats">'+esc((p.feats||FE).join("\n"))+'</textarea><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="pact"'+(p.active===false?'':' checked')+'> Show in shop</label><div class="msg" id="pm"></div><div class="inline"><button class="btn" data-act="savep">Save</button><button class="btn ghost" data-act="closem">Cancel</button></div>');
 const pv=()=>{const b=+$("pprice").value,d=+$("pdisc").value||0;$("pprev").textContent=b>0?(d>0?'Shop shows: $'+b+' crossed out, final $'+(+(b*(1-d/100)).toFixed(2))+' with a '+d+'% OFF badge':'Shop shows: $'+b):''};
 $("pprice").oninput=pv;$("pdisc").oninput=pv;pv();
}

/* SETTINGS */
let PM=[];
const readPM=()=>Array.from(document.querySelectorAll(".mrow")).map(r=>({name:r.querySelector(".pn").value.trim(),title:r.querySelector(".pt").value.trim(),number:r.querySelector(".pa").value.trim(),note:r.querySelector(".px").value.trim()}));
function drawPay(note){
 $("pp").innerHTML='<h2>Payment details (shown at checkout)</h2><p class="empty">Customers pay to these accounts, then upload a screenshot for you to approve.</p>'
 +PM.map((m,i)=>'<div class="mrow"><div class="grid2"><div><label>Method name</label><input class="pn" value="'+esc(m.name)+'" placeholder="Easypaisa"></div><div><label>Account title</label><input class="pt" value="'+esc(m.title)+'"></div><div><label>Account number / IBAN</label><input class="pa" value="'+esc(m.number)+'"></div><div><label>Extra note</label><input class="px" value="'+esc(m.note)+'" placeholder="Send as Send Money"></div></div><button class="btn ghost sm dng" style="margin-top:10px" data-act="rmpm" data-id="'+i+'">Remove</button></div>').join("")
 +'<button class="btn ghost sm" data-act="addpm">+ Add payment method</button><label for="pnote2" style="margin-top:16px">Message for customers (optional)</label><textarea id="pnote2" placeholder="Send the exact amount and keep your screenshot.">'+esc(note)+'</textarea><div class="msg" id="pmg"></div><button class="btn" data-act="savepay">Save payment details</button>';
}
async function vSet(){
 const [s,ps,ns,sec]=await Promise.all([getDoc(doc(db,"settings","diamonds")),getDoc(doc(db,"settings","payment")),getDoc(doc(db,"settings","notify")),getDoc(doc(db,"secrets","wasms"))]);
 const d=Object.assign({usd495:2.41,min:495,step:495,bulkAt:10000,bulkPct:10},s.exists()?s.data():{});
 const pd=ps.exists()?ps.data():{};PM=pd.methods||[];
 pane.innerHTML='<div class="panel"><h2>Diamond pricing</h2><div class="grid2"><div><label for="s1">Price for 495 diamonds (USD)</label><input id="s1" type="number" step="0.01" value="'+esc(d.usd495)+'"></div><div><label for="s2">Minimum diamonds</label><input id="s2" type="number" value="'+esc(d.min)+'"></div><div><label for="s3">Counter step (+ / −)</label><input id="s3" type="number" value="'+esc(d.step)+'"></div><div><label for="s4">Bulk discount starts at</label><input id="s4" type="number" value="'+esc(d.bulkAt)+'"></div><div><label for="s5">Bulk discount %</label><input id="s5" type="number" value="'+esc(d.bulkPct)+'"></div></div><div class="msg" id="sm"></div><button class="btn" data-act="saves">Save settings</button></div><div class="panel" id="pp"></div><div class="panel" id="np"></div>';
 drawPay(pd.note||"");drawNotify(ns.exists()?ns.data():{},sec.exists()?sec.data():{});
}

/* WHATSAPP + KEY ISSUING */
const DEFTPL="Hi {name}, your payment is approved ✅\n\nOrder: {order}\n\n{details}\n\nYour panel is also saved in your account under My panels: https://cheapanel.store/account.html\n\nThank you for choosing Cheapanel!";
const normPh=s=>{let d=String(s||"").replace(/\D/g,"");if(d.startsWith("00"))d=d.slice(2);if(d.startsWith("0"))d="92"+d.slice(1);return d};
const UN={day:1,week:7,month:30,year:365};
const daysOf=t=>{let n=0;String(t||"").replace(/(\d+)\s*(day|week|month|year)/gi,(m,a,u)=>{n+=+a*UN[u.toLowerCase()]});return n};
const genKey=()=>"CHP-"+rnd(4)+"-"+rnd(4)+"-"+rnd(4);
const WAERR={NO_KEY:"Add your WaSMS API key in Settings first.",UNAUTHORIZED:"WaSMS rejected the API key. Check it.",INSUFFICIENT_SCOPE:"The API key needs the messages:send permission (and accounts:read to find the account ID).",WHATSAPP_NOT_CONNECTED:"Your WhatsApp number isn’t connected in WaSMS.",WHATSAPP_DISCONNECTED:"Your WhatsApp number is disconnected in WaSMS.",NO_CONNECTED_ACCOUNT:"No connected WhatsApp number found in WaSMS.",PLAN_LIMIT:"Your WaSMS plan limit is used up.",RATE_LIMITED:"Too many requests. Try again in a minute.",NOT_ADMIN:"This account isn’t an admin.",BAD_TOKEN:"Please log in again."};
const WB="https://wasms.net/api/public/v1";
async function callWA(payload){
 const n=await getDoc(doc(db,"settings","notify"));const url=n.exists()?(n.data().workerUrl||""):"";
 if(url){
  try{
   const tok=await auth.currentUser.getIdToken();
   const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+tok},body:JSON.stringify(payload)});
   const o=await r.json().catch(()=>({}));
   if(r.ok&&o.ok)return o;
   return {ok:false,why:WAERR[o.error]||"Request failed ("+(o.error||r.status)+")."};
  }catch(e){return {ok:false,why:"Could not reach the Worker. Check the Worker URL."}}
 }
 const sd=await getDoc(doc(db,"secrets","wasms")),k=sd.exists()?sd.data().apiKey:"",acc=sd.exists()?sd.data().accountId:"";
 if(!k)return {ok:false,why:WAERR.NO_KEY};
 const fail=(o,r)=>({ok:false,why:WAERR[o.code||o.error]||"WaSMS answered with an error ("+(o.code||o.error||r.status)+")."});
 try{
  if(payload.action)return {ok:false,why:"This needs the Worker. Add the Worker URL first."};
  const q=new URLSearchParams({to:payload.to,message:payload.message,secret:k});if(acc)q.set("whatsapp_id",acc);
  await fetch(WB+"/whatsapp/send?"+q.toString(),{mode:"no-cors"});
  return {ok:true,unconfirmed:true};
 }catch(e){return {ok:false,why:"Could not reach WaSMS. Check your internet connection."}}
}
const sendWA=(to,message)=>callWA({to,message});
const fill=(t,o)=>String(t||"").replace(/\{(\w+)\}/g,(m,k)=>o[k]!=null?o[k]:m);
const TPL=[["welcome","Welcome message","Sent automatically when someone registers (needs the Worker and the WASMS_KEY secret).",1],["received","Order received","Sent when a customer uploads a payment screenshot (needs the Worker and the WASMS_KEY secret).",1],["approved","Order approved","Sent when you approve an order. License keys go in {details}.",0],["rejected","Order rejected","Sent when you reject an order.",1],["delivered","Order delivered","Sent when you set an order to Delivered, for example after a diamond top-up.",1]];
const DEFT={welcome:"Welcome to Cheapanel, {name}! 🎉\nYour account is ready. Browse our plans and diamonds at https://cheapanel.store\nNeed help? Just reply to this message.",received:"Hi {name}, we received your payment proof for {order} ({amount}). We’ll verify it and get back to you shortly. ⏳",approved:DEFTPL,rejected:"Hi {name}, we couldn’t verify your payment for {order}. Please check your screenshot and transaction ID, then contact us on WhatsApp. ❌",delivered:"Hi {name}, your order {order} has been delivered ✅ Thank you for choosing Cheapanel!"};
function drawNotify(nd,sd){
 const T=nd.templates||{};
 $("np").innerHTML='<h2>WhatsApp notifications (WaSMS)</h2><p class="empty">Connect WaSMS, then choose which messages customers receive.</p>'
 +'<label for="nkey">WaSMS API key</label><input id="nkey" type="password" autocomplete="off" placeholder="'+(sd.apiKey?'Saved. Leave blank to keep it':'wasms_…')+'">'
 +'<label for="nacc">WhatsApp account ID (optional)</label><input id="nacc" value="'+esc(sd.accountId||"")+'" placeholder="Empty = your first connected number">'
 +'<div style="margin-top:8px"><button class="btn ghost sm" data-act="findacc">Find my account ID</button></div><div id="acl"></div>'
 +'<label for="nurl">Worker URL (optional, empty = send directly)</label><input id="nurl" value="'+esc(nd.workerUrl||"")+'" placeholder="https://something.pages.dev">'
 +'<h2 style="margin-top:24px">Message templates</h2><p class="empty">You can use {name}, {order}, {amount} and {details}.</p>'
 +TPL.map(([k,t,d,auto])=>'<div class="mrow"><b>'+t+'</b><p class="empty" style="margin:2px 0 8px">'+d+'</p>'+(auto?'<label style="display:flex;gap:8px;align-items:center;margin:0 0 8px"><input type="checkbox" id="ton_'+k+'"'+((T[k]||{}).on?' checked':'')+'> Send automatically</label>':'')+'<textarea id="ttx_'+k+'" style="min-height:110px">'+esc((T[k]||{}).text||(k==="approved"?(nd.template||DEFT[k]):DEFT[k]))+'</textarea></div>').join("")
 +'<div class="mrow"><b>New order alert for you</b><p class="empty" style="margin:2px 0 8px">Get a WhatsApp message when a customer sends a payment screenshot (needs the Worker and the WASMS_KEY secret).</p><label for="nadm">Your WhatsApp number</label><input id="nadm" value="'+esc(nd.adminPhone||"")+'" placeholder="923001234567"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="nal"'+(nd.alertAdmin?' checked':'')+'> Alert me on new orders</label></div>'
 +'<div class="msg" id="nm"></div><button class="btn" data-act="savenotify">Save</button>'
 +'<label for="ntest" style="margin-top:18px">Send a test to this number</label><div class="inline"><input id="ntest" placeholder="923001234567"><button class="btn ghost" data-act="testwa">Send test</button></div><div style="margin-top:16px"><button class="btn ghost sm" data-act="checkwa">Check setup</button></div><div id="chk"></div>';
}
async function notifyOrder(kind,id){
 const d=(await getDoc(doc(db,"orders",id))).data();
 const us=await getDoc(doc(db,"users",d.uid)),u=us.exists()?us.data():{name:"there",whatsapp:""};
 const ns=await getDoc(doc(db,"settings","notify")),nd=ns.exists()?ns.data():{},t=(nd.templates||{})[kind]||{};
 if(!t.on)return;
 const num=normPh(u.whatsapp);if(num.length<8)return;
 const text=fill(t.text||DEFT[kind],{name:u.name||"there",order:d.item,amount:"$"+d.price,details:""});
 const res=await sendWA(num,text);
 openM('<h2>Customer notified</h2><div class="msg'+(res.ok?' ok':'')+'" style="min-height:0">'+(res.ok?(res.unconfirmed?'Request sent to +'+esc(num)+'. Delivery can’t be confirmed in this mode.':'WhatsApp message sent to +'+esc(num)+'.'):esc(res.why))+'</div><textarea readonly>'+esc(text)+'</textarea><div class="inline" style="margin-top:14px"><a class="btn" target="_blank" rel="noopener" href="https://wa.me/'+num+'?text='+encodeURIComponent(text)+'">Send manually</a><button class="btn ghost" data-act="closem">Close</button></div>');
}

/* ACTIONS */
const msg=(id,t,ok)=>{const m=$(id);if(m){m.textContent=t;m.className="msg"+(ok?" ok":"")}};
const ACT={
 view:id=>run(()=>vView(id)),
 back:()=>go("users"),
 closem:()=>closeM(),
 addpm:()=>{PM=readPM();PM.push({name:"",title:"",number:"",note:""});drawPay($("pnote2").value)},
 rmpm:i=>{PM=readPM();PM.splice(+i,1);drawPay($("pnote2").value)},
 savepay:()=>run(async()=>{const m=readPM().filter(x=>x.name&&x.number);await setDoc(doc(db,"settings","payment"),{methods:m,note:$("pnote2").value.trim()});PM=m;msg("pmg","Saved. Customers see these at checkout.",true)}),
 proof:id=>run(async()=>{
  const [o,pr]=await Promise.all([getDoc(doc(db,"orders",id)),getDoc(doc(db,"proofs",id))]);
  const d=o.data(),im=pr.exists()&&String(pr.data().image).startsWith("data:image/")?pr.data().image:"";
  const r=(a,b)=>'<div class="row"><span>'+a+'</span><b>'+esc(b)+'</b></div>';
  openM('<h2>Payment proof</h2>'+r("Order",d.item)+r("Amount","$"+d.price)+r("Method",d.method)+r("Sender",d.sender)+r("Transaction ID",d.txid)+(d.pid?r("Player ID",d.pid):"")+r("Status",d.status)+(im?'<img src="'+im+'" style="max-width:100%;margin-top:12px;border:1px solid var(--line);border-radius:6px" alt="Payment screenshot">':'<p class="empty">No screenshot found.</p>')+'<div class="inline" style="margin-top:16px"><button class="btn" data-act="appr" data-id="'+esc(id)+'">Approve</button><button class="btn ghost dng" data-act="rej" data-id="'+esc(id)+'">Reject</button><button class="btn ghost" data-act="closem">Close</button></div>');
 }),
 appr:id=>run(async()=>{
  const d=(await getDoc(doc(db,"orders",id))).data();
  const us=await getDoc(doc(db,"users",d.uid)),u=us.exists()?us.data():{name:"there",whatsapp:""};
  const items=d.items||[{n:d.item,p:d.price,x:""}];
  let keys=d.keys||[];const lines=[];
  if(!d.keysIssued){
   for(const it of items){
    if(/diamond/i.test(it.n))continue;
    let key;do{key=genKey()}while((await getDoc(doc(db,"licenses",key))).exists());
    const dy=daysOf(it.n)+daysOf(it.x),now=Date.now();
    await setDoc(doc(db,"licenses",key),{plan:it.n,assignedTo:d.uid,orderId:id,created:now,redeemedAt:now,days:dy,expiresAt:dy?now+dy*864e5:null});
    keys.push({plan:it.n,key,days:dy});
   }
   await updateDoc(doc(db,"orders",id),{status:"Paid",keys,keysIssued:true});
  }else if(d.status!=="Paid"){await updateDoc(doc(db,"orders",id),{status:"Paid"})}
  keys.forEach(k=>lines.push("🔑 "+k.plan+"\nKey: "+k.key+(k.days?"\nValid for "+k.days+" days":"")));
  items.filter(it=>/diamond/i.test(it.n)).forEach(it=>lines.push("💎 "+it.n+": we are topping up Player ID "+d.pid+" now."));
  const ns=await getDoc(doc(db,"settings","notify")),nd=ns.exists()?ns.data():{},tpl=((nd.templates||{}).approved||{}).text||nd.template||DEFTPL;
  const text=fill(tpl,{name:u.name||"there",order:d.item,amount:"$"+d.price,details:lines.join("\n\n")});
  const num=normPh(u.whatsapp);
  await vOrders();
  const res=num.length>=8?await sendWA(num,text):{ok:false,why:"This customer has no valid WhatsApp number."};
  openM('<h2>Order approved</h2><div class="msg'+(res.ok?' ok':'')+'" style="min-height:0">'+(res.ok?(res.unconfirmed?'Message request sent to +'+esc(num)+'. This mode can’t confirm delivery. If it doesn’t arrive, use the button below.':'WhatsApp message sent to +'+esc(num)+'.'):esc(res.why))+'</div><label>Message</label><textarea readonly>'+esc(text)+'</textarea><div class="inline" style="margin-top:14px"><a class="btn" target="_blank" rel="noopener" href="https://wa.me/'+num+'?text='+encodeURIComponent(text)+'">Send manually on WhatsApp</a><button class="btn ghost" data-act="closem">Close</button></div>');
 }),
 savenotify:()=>run(async()=>{
  const k=$("nkey").value.trim(),acc=$("nacc").value.trim();
  if(k&&!/^wasms_/.test(k))return msg("nm","The API key should start with wasms_.");
  const templates={};TPL.forEach(([id,,,auto])=>{templates[id]={on:auto?$("ton_"+id).checked:true,text:$("ttx_"+id).value}});
  await setDoc(doc(db,"settings","notify"),{workerUrl:$("nurl").value.trim(),template:templates.approved.text,templates,adminPhone:normPh($("nadm").value),alertAdmin:$("nal").checked});
  const cur=await getDoc(doc(db,"secrets","wasms")),old=cur.exists()?cur.data():{};
  await setDoc(doc(db,"secrets","wasms"),{apiKey:k||old.apiKey||"",accountId:acc});
  $("nkey").value="";$("nkey").placeholder="Saved. Leave blank to keep it";msg("nm","Saved.",true)}),
 findacc:()=>run(async()=>{
  const r=await callWA({action:"accounts"});
  if(!r.ok)return msg("nm",r.why);
  const l=r.accounts||[];
  $("acl").innerHTML=l.length?l.map(a=>'<div class="row"><div><b>'+esc(a.phone||a.display_name||a.name||a.id)+'</b><small>'+esc(a.id)+'</small></div><button class="btn ghost sm" data-act="pickacc" data-id="'+esc(a.id)+'">Use</button></div>').join(""):'<p class="empty">No connected WhatsApp numbers found.</p>';
  msg("nm","");}),
 checkwa:()=>run(async()=>{
  const n=await getDoc(doc(db,"settings","notify")),nd=n.exists()?n.data():{},T=nd.templates||{};
  const r=await callWA({action:"status"});
  const li=(ok,t)=>'<div class="row"><span>'+(ok?'✅':'❌')+' '+t+'</span></div>';
  let h='';
  if(!r.ok)h=li(false,'Worker: '+esc(r.why));
  else h=li(true,'Worker is reachable')+li(r.savedKey,'WaSMS key saved in Settings')+li(r.envKey,'WASMS_KEY secret added in Cloudflare (needed for welcome, order received and your alerts)');
  h+=li(!!(T.welcome&&T.welcome.on),'Welcome message switched on and saved')+li(!!(T.received&&T.received.on),'Order received message switched on and saved')+li(!!(nd.alertAdmin&&nd.adminPhone),'New order alert has your number and is on');
  $("chk").innerHTML=h}),
 pickacc:id=>{$("nacc").value=id;$("acl").innerHTML=""},
 testwa:()=>run(async()=>{const n=normPh($("ntest").value);if(n.length<8)return msg("nm","Enter a number with country code.");const r=await sendWA(n,"Test message from Cheapanel admin ✅");msg("nm",r.ok?(r.unconfirmed?"Test request sent. Check your WhatsApp. This mode can’t confirm delivery.":"Test sent. Check WhatsApp."):r.why,r.ok)}),
 rej:id=>run(async()=>{await updateDoc(doc(db,"orders",id),{status:"Rejected"});closeM();await vOrders();await notifyOrder("rejected",id)}),
 feat:()=>{if(!confirm("Replace the feature list on ALL plans?"))return;run(async()=>{for(const p of P)await updateDoc(doc(db,"products",p.id),{feats:FE});await vProd()})},
 addu:()=>formNewU(),
 editu:id=>formU(U.find(x=>x.id===id)),
 saveu:id=>run(async()=>{const n=$("un").value.trim();if(n.length<2)return msg("um","Enter a name.");const d={name:n,whatsapp:$("uw").value.trim(),balance:+$("ub").value||0};await updateDoc(doc(db,"users",id),d);closeM();await vUsers()}),
 delu:id=>{if(!confirm("Delete this user's record, orders stay. Their login stays in Firebase Authentication until you remove it there. Continue?"))return;run(async()=>{await deleteDoc(doc(db,"users",id));await vUsers()})},
 mku:()=>run(async()=>{
  const n=$("mn").value.trim(),e=$("me").value.trim().toLowerCase(),w=$("mw").value.trim(),p=$("mp").value;
  if(n.length<2||!/^\S+@\S+\.\S+$/.test(e)||p.length<8)return msg("mm","Enter a name, a valid email and a password of 8+ characters.");
  const sa=initializeApp(cfg,"sec"+Date.now()),au=getAuth(sa),sd=getFirestore(sa);
  try{const c=await createUserWithEmailAndPassword(au,e,p);await setDoc(doc(sd,"users",c.user.uid),{name:n,email:e,whatsapp:w,balance:0,joined:Date.now()});await signOut(au);closeM();await vUsers()}
  catch(x){msg("mm",x.code==="auth/email-already-in-use"?"That email already has an account.":(x.code||x.message))}
 }),
 addp:()=>formP(),

 tog:id=>run(async()=>{const p=P.find(x=>x.id===id);await updateDoc(doc(db,"products",id),{active:p.active===false});await vProd()}),
 bal:id=>run(async()=>{await updateDoc(doc(db,"users",id),{balance:+$("bal").value||0});const u=U.find(x=>x.id===id);if(u)u.balance=+$("bal").value||0;msg("bm","Saved.",true)}),
 gen:()=>run(async()=>{

  $("lout").value=out.join("\n");msg("lmg",n+" key(s) created. Copy them and send to the customer.",true);drawL()}),

 seed:()=>run(async()=>{let i=0;for(const [cat,game] of [["ff","Free Fire"],["pubg","PUBG Mobile"]])for(const p of PL){await setDoc(doc(collection(db,"products")),{cat,game,name:"Aimbot Panel – "+p[0],price:p[1],per:p[2],bonus:p[3],old:p[4],save:p[5],feats:FE,order:i++,active:true})}await vProd()}),
 savep:()=>run(async()=>{

 saves:()=>run(async()=>{
